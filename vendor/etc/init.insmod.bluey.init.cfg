####################################################
# init.insmod.bluey.init.cfg
#
# This file contains common kernel modules to load at init time by
# the init.insmod.sh script. This script is started in the background
# and is not guaranteed to finish before init concludes.
#
# Before adding an entry, please consider if the module is already loaded by
# ueventd. ueventd consults /{system,vendor}_dlkm/lib/modules/modules.alias
# and automatically loads a module if a matching alias is found.
####################################################

# Load common kernel modules
# Enable wifi drivers
modprobe|cnss2.ko
modprobe|cnss_plat_ipc_qmi_svc.ko
modprobe|cnss_nl.ko
modprobe|cnss_prealloc.ko
modprboe|cnss_utils.ko
modprobe|wlan_firmware_service.ko
modprobe|qca_cld3_kiwi_v2.ko
# Enable bluetooth drivers
modprobe|btpower.ko
modprobe|radio-i2c-rtc6226-qca.ko
