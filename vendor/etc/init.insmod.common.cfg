####################################################
# init.insmod.common.earlyinit.cfg
#
# This file contains common kernel modules to load at early-init time by
# the init.insmod.sh script. This script is started in the background and
# is not guaranteed to finish before early-init concludes.
#
# Before adding an entry, please consider if the module is already loaded by
# ueventd. ueventd consults /{system,vendor}_dlkm/lib/modules/modules.alias
# and automatically loads a module if a matching alias is found.
####################################################

# Load common kernel modules
modprobe|cbmem
modprobe|coreboot_table
modprobe|iio-trig-hrtimer
modprobe|ip6table_nat
modprobe|memconsole
modprobe|memconsole-coreboot
modprobe|nvram
modprobe|system_heap
modprobe|vpd-sysfs
modprobe|zram
